apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
    spec:
      containers:
      - name: django-app
        image: <DOCKERHUB_KULLANICI_ADIN>/django-app:latest
        ports:
        - containerPort: 8000
        env:
        - name: DJANGO_SECRET_KEY
          value: "kendi-uretim-sifreni-buraya-yaz-uzun-bir-sey-olsun"
        - name: DJANGO_DEBUG
          value: "False"
        - name: DJANGO_ALLOWED_HOSTS
          # Şimdilik Ingress üzerinden gelecek istekler için Master NLB IP'ni veya domainini yazabilirsin
          value: "10.53.0.93,127.0.0.1,localhost,43.229.92.13"
