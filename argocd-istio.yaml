apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aziz-mevlana.github.io/kubernetes-03-production-ready-RKE2-HA-cluster/
    chart: istiod
    targetRevision: 1.30.4
    helm:
      parameters:
        - name: pilot.resources.requests.cpu
          value: "100m"
        - name: pilot.resources.requests.memory
          value: "256Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true