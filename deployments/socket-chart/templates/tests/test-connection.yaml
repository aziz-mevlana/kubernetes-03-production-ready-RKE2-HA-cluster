apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "socket-chart.fullname" . }}-test-connection"
  labels:
    {{- include "socket-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: tcp-ping
      image: busybox
      command: ['sh', '-c']
      args: ['echo PING | nc -w 5 {{ include "socket-chart.fullname" . }} {{ .Values.service.port }} | grep -q PONG']
  restartPolicy: Never