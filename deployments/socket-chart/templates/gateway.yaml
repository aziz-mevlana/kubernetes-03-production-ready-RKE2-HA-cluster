{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: socket-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: gateway
  servers:
    - port:
        number: 31400
        name: tcp-socket
        protocol: TCP
      hosts:
        - "*"
{{- end }}