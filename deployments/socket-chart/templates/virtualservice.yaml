{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: socket-virtualservice
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - "*"
  gateways:
    - socket-gateway
  tcp:
    - match:
        - port: 31400
      route:
        - destination:
            host: {{ include "socket-chart.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
{{- end }}